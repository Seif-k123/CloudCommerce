apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: ecommerce
  labels:
    app: backend

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      nodeSelector:
        workload: application

      terminationGracePeriodSeconds: 30
      serviceAccountName: backend-sa
      containers:
        - name: backend
          image: ecommerce-backend:v3
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: backend-config

            - secretRef:
                name: backend-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 2

          livenessProbe:
            httpGet:
              path: /liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
