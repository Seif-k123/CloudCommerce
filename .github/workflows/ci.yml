name: CloudCommerce CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'app/backend/**'

  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - changes
      - test

    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.changes.outputs.backend == 'true'
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Docker for Nexus HTTP
        run: |
          echo '{"insecure-registries":["107.21.92.37:8082"]}' | sudo tee /etc/docker/daemon.json

          sudo systemctl restart docker

          echo "Checking Docker insecure registries..."
          docker info | sed -n '/Insecure Registries:/,/Live Restore Enabled/p'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."107.21.92.37:8082"]
              http = true
              insecure = true

      - name: Log in to Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_URL }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: true
          tags: ${{ secrets.NEXUS_URL }}/ecommerce-backend:${{ github.sha }}

  update-image:
    name: Update Helm Image Tag
    runs-on: ubuntu-latest
    needs:
      - docker

    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        needs.docker.result == 'success'
      )

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        uses: mikefarah/yq@v4.45.1

      - name: Update backend image tag
        run: |
          yq -i '.backend.image.tag = "${{ github.sha }}"' helm/ecommerce/values.yaml

      - name: Verify Helm image tag
        run: |
          echo "Backend image:"
          yq '.backend.image.repository + ":" + .backend.image.tag' helm/ecommerce/values.yaml

      - name: Commit and Push Helm Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/ecommerce/values.yaml

          git commit -m "chore: update backend image to ${{ github.sha }} [skip ci]"

          git push
